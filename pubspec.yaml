name: useyi_monitor
description: USEYI Monitor - QR attendance app for UPSHIFT Youth Empowerment Initiative.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.0
  intl: ^0.19.0
  share_plus: ^11.1.0
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
